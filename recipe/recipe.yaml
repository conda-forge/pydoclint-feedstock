schema_version: 1

context:
  name: pydoclint
  version: "0.10.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/76/01/af79b4a9f6288fddd8503ffeb544b15db1f648dfbaa992dbc98159a04805/pydoclint-${{ version }}.tar.gz
  sha256: baa2ec9a1d1d60fbcf56fd56d75fbf37b426dfb620a04696ab3365025f44749c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pydoclint = pydoclint.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.1.0
    - docstring_parser_fork ==0.0.16
    - tomli >=2.0.1

tests:
  - python:
      imports:
        - pydoclint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pydoclint --help

about:
  homepage: https://github.com/jsh9/pydoclint
  summary: A Python docstring linter that checks arguments, returns, yields, and raises sections
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
