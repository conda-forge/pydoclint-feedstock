schema_version: 1

context:
  name: pydoclint
  version: "0.11.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/14/b7/73a2219d61e3a5b9e282390152bde892ae36e877f321bf3bca76c5f769b2/pydoclint-${{ version }}.tar.gz
  sha256: cef4278a754fb5ceaad5ebe48f131499b51295f94656c7a3d6df9512cd8de0d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pydoclint = pydoclint.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.1.0
    - docstring_parser_fork ==0.0.16
    - tomli >=2.0.1

tests:
  - python:
      imports:
        - pydoclint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pydoclint --help

about:
  homepage: https://github.com/jsh9/pydoclint
  summary: A Python docstring linter that checks arguments, returns, yields, and raises sections
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
